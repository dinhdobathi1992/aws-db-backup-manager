<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3B6BFF"/>
      <stop offset="0.55" stop-color="#1B3BA8"/>
      <stop offset="1" stop-color="#0B1650"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCE5FF"/>
      <stop offset="0.45" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#AFC2F5"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EBFF"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC45C"/>
      <stop offset="1" stop-color="#FF7A00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#06103A" flood-opacity="0.45"/>
    </filter>
    <clipPath id="body">
      <path d="M270 330 V690 A200 62 0 0 0 670 690 V330 Z"/>
    </clipPath>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- macOS-style squircle tile -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- faint orbit: the backup cycle -->
    <circle cx="470" cy="520" r="300" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="18" stroke-dasharray="60 34"/>
  </g>

  <!-- database cylinder, three platters -->
  <g filter="url(#soft)">
    <path d="M270 330 V690 A200 62 0 0 0 670 690 V330 Z" fill="url(#disc)"/>
    <g clip-path="url(#body)">
      <path d="M262 450 A208 62 0 0 0 678 450" fill="none" stroke="#3653C9" stroke-opacity="0.55" stroke-width="12"/>
      <path d="M262 570 A208 62 0 0 0 678 570" fill="none" stroke="#3653C9" stroke-opacity="0.55" stroke-width="12"/>
    </g>
    <ellipse cx="470" cy="330" rx="200" ry="62" fill="url(#top)"/>
    <ellipse cx="470" cy="330" rx="200" ry="62" fill="none" stroke="#3653C9" stroke-opacity="0.35" stroke-width="6"/>
  </g>

  <!-- protection shield: backups are never deleted -->
  <g filter="url(#soft)">
    <path d="M700 480 L842 530 V648 C842 748 784 810 700 842 C616 810 558 748 558 648 V530 Z" fill="url(#shield)" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>
    <path d="M636 658 L684 706 L770 610" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
